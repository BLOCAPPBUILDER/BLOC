body{ background:#16161a; color:#eee; font:14px/1.4 system-ui,sans-serif; padding:12px; }
h1{ font-size:20px; margin:4px 0 2px; } .sub{ color:#aaa; margin-bottom:12px; }
.leg{ display:flex; gap:14px; flex-wrap:wrap; margin:8px 0 14px; font-size:13px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
.k{ background:#232329; border-radius:12px; padding:10px; border:2px solid transparent; }
.k.unsicher{ border-color:#e5a400; } .k.offen{ border-color:#e5484d; }
.k h3{ margin:0 0 2px; font-size:15px; } .k small{ color:#999; display:block; margin-bottom:6px; }
.f{ display:flex; gap:4px; flex-wrap:wrap; } .f svg{ width:110px; height:110px; background:#2e2e35; border-radius:8px; color:#fff; }
.f .l{ font-size:11px; color:#aaa; width:100%; margin-top:4px; }
.grund{ margin-top:6px; font-size:12.5px; color:#f2c230; } .offen .grund{ color:#ff7a7f; }
@media print{
 body{ background:#fff !important; color:#111 !important; padding:0 !important; }
 .sub a{ display:none; } .sub{ color:#555; }
 .grid{ grid-template-columns:repeat(3,1fr); gap:8px; }
 .k{ background:#fff; border:1.5px solid #ccc; break-inside:avoid; page-break-inside:avoid; padding:6px; }
 .k.unsicher{ border-color:#d99a00; } .k.offen{ border-color:#d33; }
 .k h3{ color:#111; font-size:13px; } .k small{ color:#777; }
 .f svg{ background:#eceef2; color:#222; width:82px; height:82px; }
 .grund{ color:#a06a00; font-size:10.5px; } .offen .grund{ color:#c22; }
 .leg span{ color:#333 !important; }

<script>
/* Figuren-Prüfliste: alle Übungen mit ihren Figuren (Pose A und B, zweite Ansicht); gelb = unsicher, rot = bekannt unzureichend (noch offen) */
var UNSICHER = {
  "band-clamshell":"Neue zweite Ansicht von oben (Seitenlage, Knie öffnet sich); das Band ist nur ein kleiner Strich.",
  "wide-grip-cable-row":"Neue zweite Ansicht von vorn (weite Griffe an der Stange); Armwinkel grob.",
  "side-jackknives":"Testweise: dicker Körper, Arm gestreckt, zusätzlich Ansicht von oben mit der seitlichen Beuge; Kopf/Arm dort noch klein.",
  "copenhagen-plank":"Nach deinem Foto und deiner Skizze: dicker Körper, gestreckter Stützarm mit Gelenkkreis, Obenarm an der Hüfte.",
  "bicycle-crunches":"Testweise nach deinem Vorschlag: Knie höher, der diagonale Arm führt zum Knie. Pose B (Seitenwechsel) zeigt den Arm nur schwach.",
  "tate-press":"Nur Ansicht von vorn, nach deiner Skizze gezeichnet (Blick von den Füßen, Bank von vorn).",
  "db-bench-press":"Zweite Ansicht von vorn: Arme und Bank mit Tate-Press-Zeichnung abgeleitet.",
  "prone-t-raise":"Zweite Ansicht von oben: wirkt eher wie ein Stehender von vorn; die Anhebung ist nur seitlich zu sehen.",
  "prone-y-raise":"Zweite Ansicht von oben: wie T-Raise, Form Y erkennbar, Bauchlage unklar.",
  "face-pull":"Zweite Ansicht von vorn: Anfangspose (Arme vorn) wenig eindeutig.",
  "upright-row":"Zweite Ansicht von vorn: Stange schlecht erkennbar.",
  "pallof-press":"Zweite Ansicht von vorn: Kabel von der Seite, Widerstand gegen die Drehung kaum zu sehen.",
  "cable-woodchop":"Neu gezeichnet mit Rolle, Zugseil und Knoten; Seilknoten klein.",
  "cable-crunch":"Seil ergänzt; zweite Pose (Kopf am Boden-nah) wirkt gedrungen.",
  "rotary-torso":"Neu gezeichnet: die Drehung ist nur eine leichte Neigung, kein echtes Drehen.",
  "bear-plank-rockback-push-up":"Neu: Rockback und Liegestütz-unten wirken gedrungen.",
  "plank-toe-touch":"Neu: Hand zum Fuß schwer als Berührung erkennbar.",
  "around-world-pullover":"Zweite Ansicht von oben ist eine Kopie vom Pullover, nicht eigens gezeichnet.",
  "hammer-curl":"Zweite Ansicht von vorn ist die vom normalen Curl: der Neutralgriff ist nicht zu sehen.",
  "cross-body-hammer-curl":"Wie Hammer Curl: Neutralgriff und Diagonale nicht zu sehen."
};
var OFFEN = {
  "swimmers":"Seitenansicht zeigt die wechselnde Arm-/Bein-Bewegung nicht eindeutig; eine Ansicht von oben wirkt wie eine stehende Person und wurde verworfen.",
  "plank-shoulder-taps":"Seitenansicht zeigt die Hüftstabilität nicht; eine Ansicht von oben wirkt wie eine stehende Person und wurde verworfen (Vorschlag von dir gesucht).",
};
window.addEventListener("load", function(){ setTimeout(function(){
  ["app","playerRoot","overlayRoot","tabbar"].forEach(function(i){ var e=document.getElementById(i); if(e) e.remove(); }); document.body.className = ""; document.body.style.cssText = "background:#16161a;color:#eee;padding:12px;min-height:0";
  var bg=document.querySelector(".glas-bg"); if(bg) bg.remove();
  function svg(p, i, top){ if(!p || !p[i]) return ""; return '<svg class="illu still" viewBox="0 0 100 100">'+(top?ILLU_MATTE:'<path class="illu-floor" d="M6 91h88"/>')+'<g class="pose-a">'+illuIds(p[i])+'</g></svg>'; }
  var ex = EXERCISES.filter(function(e){ return e.main !== "stretch" && ILLU[e.id]; });
  function rang(e){ return OFFEN[e.id] ? 0 : UNSICHER[e.id] ? 1 : 2; }
  ex.sort(function(a,b){ return rang(a)-rang(b) || tplText(a.name).localeCompare(tplText(b.name), "de"); });
  var n1=0,n0=0; ex.forEach(function(e){ if(UNSICHER[e.id]) n1++; if(OFFEN[e.id]) n0++; });
  var STILL = /[?&]still=1/.test(location.search);   /* Standard: dieselbe Animation wie in der App (illuHTML, die App setzt sichtbare Figuren selbst in Bewegung); ?still=1 zeigt Standbilder A und B */
  var h='<h1>Figuren-Prüfliste</h1><div class="sub">'+ex.length+' Übungen mit Figur · <a style="color:#8ab4ff" href="'+(STILL ? '?' : '?still=1')+'">'+(STILL ? 'in Bewegung zeigen' : 'Standbilder A/B zeigen')+'</a></div>'+
    '<div class="leg"><span style="color:#ff7a7f">■ rot: bekannt unzureichend, noch offen ('+n0+')</span><span style="color:#f2c230">■ gelb: unsicher, bitte prüfen ('+n1+')</span><span>■ ohne Rahmen: nicht beanstandet</span></div><div class="grid">';
  ex.forEach(function(e){
    var cls = OFFEN[e.id] ? "offen" : UNSICHER[e.id] ? "unsicher" : "", v2 = ILLU2[e.id], top = v2 && ILLU_VIEW2[e.id] && ILLU_VIEW2[e.id].typ==="top";
    h+='<div class="k '+cls+'"><h3>'+tplText(e.name)+'</h3><small>'+e.id+'</small><div class="f">'+(STILL ? svg(ILLU[e.id],0)+svg(ILLU[e.id],1) : illuHTML(e.id, "", false))+
      (v2 ? (STILL ? svg(v2,0,top)+svg(v2,1,top) : illuHTML(e.id, "", true))+'<div class="l">links Hauptansicht, rechts zweite Ansicht ('+(ILLU_VIEW2[e.id].typ)+')</div>' : '')+'</div>'+
      (cls ? '<div class="grund">'+(OFFEN[e.id]||UNSICHER[e.id])+'</div>' : '')+'</div>';
  });
  document.body.insertAdjacentHTML("beforeend", h+'</div>');
}, 600); });
</script>
