<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BLOC-Icon: Stoppuhr, deren Zifferblatt aus drei gestapelten Blöcken besteht.
       Vollflächig (ohne Rundung), damit es auch als "maskable" Icon passt;
       alles Wichtige liegt im sicheren Kreis (80 % der Fläche). -->
  <rect width="512" height="512" fill="#121214"/>
  <rect x="226" y="60" width="60" height="42" rx="8" fill="#ffffff"/>
  <circle cx="256" cy="270" r="158" fill="none" stroke="#ff5a36" stroke-width="34"/>
  <rect x="176" y="194" width="160" height="40" rx="12" fill="#ffffff"/>
  <rect x="176" y="250" width="160" height="40" rx="12" fill="#ffffff" fill-opacity=".75"/>
  <rect x="176" y="306" width="160" height="40" rx="12" fill="#ffffff" fill-opacity=".5"/>
</svg>
