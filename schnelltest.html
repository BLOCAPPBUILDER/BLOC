<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOC Schnelltest</title>
<style>
  :root { --bg:#f5f5f2; --text:#1d1d1f; --dim:#6b6b70; --ok:#1f9d63; --fail:#d6453d; --card:#fff; --rule:#e2e2dd; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121214; --text:#f2f2f2; --dim:#a0a0a6; --card:#1d1d20; --rule:#2e2e33; } }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { display:flex; gap:20px; padding:16px; flex-wrap:wrap; }
  .links { flex:1 1 320px; min-width:0; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--dim); margin:0 0 12px; }
  button { font:inherit; padding:10px 16px; border-radius:10px; border:0; background:#ff5a36; color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  #summe { font-weight:700; margin:12px 0; }
  #summe.ok { color:var(--ok); } #summe.fail { color:var(--fail); }
  ol { padding-left:22px; margin:0; }
  li { margin:4px 0; }
  li.ok::marker { color:var(--ok); } li.fail { color:var(--fail); }
  li small { display:block; color:var(--dim); }
  iframe { width:390px; height:780px; border:1px solid var(--rule); border-radius:14px; background:#fff; flex:0 0 auto; max-width:100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="links">
    <h1>BLOC Schnelltest</h1>
    <p>Klickt sich einmal durch die wichtigsten Wege der App. Läuft nur lokal (localhost). Dein gespeicherter Stand wird vorher
      beiseitegelegt und danach wiederhergestellt.</p>
    <button id="los" type="button">Test starten</button>
    <div id="summe"></div>
    <ol id="liste"></ol>
  </div>
  <iframe id="app" title="App im Test"></iframe>
</div>
<script>
(function () {
  "use strict";
  var KEY = "sporttimer-data-v1";
  var iframe = document.getElementById("app"), liste = document.getElementById("liste"), summe = document.getElementById("summe");
  var W = null, D = null, fehler = [];
  var lokal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === "file:";

  function warte(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function bis(fn, ms, was) {
    var t0 = Date.now();
    while (Date.now() - t0 < (ms || 4000)) {
      try { var v = fn(); if (v) return v; } catch (e) {}
      await warte(50);
    }
    throw new Error("Zeitüberschreitung: " + (was || "Bedingung"));
  }
  function $(s) { return D.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(D.querySelectorAll(s)); }
  function klick(s) { var el = typeof s === "string" ? $(s) : s; if (!el) throw new Error("nicht gefunden: " + s); el.click(); return el; }
  function pruefe(b, text) { if (!b) throw new Error(text); }
  function sichtbar(el) { return el && el.style.display !== "none" && !el.hidden && el.offsetParent !== null; }
  function eingeben(el, wert) { el.value = wert; el.dispatchEvent(new W.Event("input", { bubbles: true })); el.dispatchEvent(new W.Event("change", { bubbles: true })); }

  function laden() {
    return new Promise(function (ok) {
      iframe.onload = function () {
        W = iframe.contentWindow; D = W.document;
        W.addEventListener("error", function (e) { fehler.push(String(e.message || e)); });
        var alt = W.console.error;
        W.console.error = function () { fehler.push(Array.prototype.join.call(arguments, " ")); return alt.apply(W.console, arguments); };
        setTimeout(ok, 400);
      };
      iframe.src = "index.html?schnelltest=" + Date.now() + "&lang=de#home";   // Texte immer deutsch, egal welche Browsersprache
    });
  }
  // Filterkarte (Air, Studio, Mobility & Stretch) aufklappen, falls sie zu ist
  async function filterAuf() {
    if (!$(".af-body")) klick(".af-kopf");
    await bis(function () { return $(".af-body"); }, 2000, "Filterkarte offen");
  }
  function zuWorkout() { W.state.db.settings.katTab = "baukasten"; W.go("#katalog"); }   // früher der Kopfblock auf der Startseite, jetzt direkt über die Adresse
  async function heim() { await laden(); await bis(function () { return $(".kopf-neu"); }, 5000, "Startseite"); }   // Heute: Foto-Kopf (die Bereichs-Kacheln stehen auf „Training“)
  // Workout-Wege (seit 2026-10-22: Reiter Baukasten · BLOCs; der Katalog ist eine Karte im Baukasten, der Übungskatalog nur noch über #uebungskatalog)
  async function zuKatalogTab() {
    if (!$("[data-kattab]")) {   // auf einer Unterseite (Übungskatalog, Plan): zurück
      if ($("button.back")) klick("button.back");
      else klick('[data-nav="#katalog"]');
    }
    var b = await bis(function () { return $('[data-kattab="baukasten"]'); }, 3000, "Reiter Baukasten");
    if (!b.classList.contains("active")) klick(b);
    klick(await bis(function () { return $("[data-baukatalog]"); }, 3000, "Katalog-Karte im Baukasten"));
    await bis(function () { return $(".kat-seitentitel"); }, 3000, "Katalog-Seite");
  }
  // Es gibt nirgends mehr einen Ort-Schalter (Baukasten, Plan-Bau, Übungskatalog, Workoutkatalog, Überrasch mich): überall wählt man die Trainingsart (trainNur).
  // Trainingsart: drei Fotokarten (Fitnessstudio · Calisthenic-Park · Körpergewicht), Mehrfachwahl, leer = alles. trainNur tippt genau die nötigen Karten an,
  // bis nur die gewünschten gewählt sind (arten: Liste aus "studio", "cali", "body"). attr: "sttrain" (Filter im Plan-Bau und Übungskatalog; die Filterkarte wird bei Bedarf
  // geöffnet), "bauort" (Workout-Entwurf) oder "sptrain" (Überrasch-mich-Fenster)
  var ARTEN = ["studio", "cali", "body"];
  async function trainNur(arten, attr) {
    attr = attr || "sttrain";
    if (attr === "sttrain" && !$('[data-sttrain]')) await filterAuf();
    function an(a) { var k = $('[data-' + attr + '="' + a + '"]'); pruefe(k, "Karte der Trainingsart fehlt: data-" + attr + "=" + a); return k.classList.contains("on"); }
    for (var i = 0; i < ARTEN.length; i++) if (an(ARTEN[i]) !== (arten.indexOf(ARTEN[i]) > -1)) klick($('[data-' + attr + '="' + ARTEN[i] + '"]'));
    await bis(function () { return ARTEN.every(function (a) { return an(a) === (arten.indexOf(a) > -1); }); }, 2000, "Trainingsart " + (arten.join("+") || "alle") + " (data-" + attr + ")");
  }
  function trainSetzen(arten) { var s = W.state.db.settings; s.stTrain = arten || []; s.stAusr = []; W.save(); }   // Ausgangslage für die Seite, die gleich geöffnet wird
  async function zuWorkoutKatalog() {
    trainSetzen([]);
    await zuKatalogTab();
    await bis(function () { return $(".af-kopf") && $$(".lib-card").length > 0; }, 3000, "Workoutkatalog mit Filterkarte");
  }
  async function zuMeine() {   // BLOCs
    if (!$("[data-kattab]")) { if ($("button.back")) klick("button.back"); }
    var b = await bis(function () { return $('[data-kattab="blocs"]'); }, 3000, "Reiter BLOCs");
    if (!b.classList.contains("active")) klick(b);
    await bis(function () { return $('[data-kattab="blocs"].active'); }, 2000, "BLOCs aktiv");
  }
  // Übungskatalog; arten = die Trainingsarten, die im Filter gewählt sein sollen (ohne Angabe: keine gewählt = alle Übungen, Ausrüstung leer)
  async function zuUebungskatalog(arten) {
    trainSetzen(arten);
    W.state.db.settings.katTab = "katalog"; W.state.db.settings.katAbt = "uebungen"; W.renderKatalog();
    await bis(function () { return $("#st-q") && $$("[data-studio]:not([data-ortfremd])").length > 0; }, 3000, "Übungskatalog");
  }
  async function zuBaukasten(modus) {   // setzt die Wahl im Filter (Trainingsart, Ausrüstung) zurück; modus: "timer" (Standard) oder "gewicht" (Nach Zeit / Nach Sätzen)
    trainSetzen([]);
    if (!$("[data-kattab]")) { if ($("button.back")) klick("button.back"); }
    var b = await bis(function () { return $('[data-kattab="baukasten"]'); }, 3000, "Reiter Baukasten");
    if (!b.classList.contains("active")) klick(b);
    await bis(function () { return $("[data-bauselber]"); }, 3000, "Baukasten");
    // modus wird ignoriert: Zeit oder Sätze wählt man erst auf der Plan-Seite
  }

  var TESTS = [
    ["Einführung: nur beim ersten Start, fünf Seiten (Sprache, Über dich, Aufbau, zwei Bereiche mit Zahlen), danach in den Einstellungen", async function () {
      await heim();   // der Test startet ohne gespeicherte Daten - wie eine neue Installation
      await bis(function () { return $("#overlayRoot .intro-sheet"); }, 3000, "Einführung beim ersten Start");
      var titel = [];
      for (var i = 0; i < 5; i++) {
        titel.push($(".intro-seite h2").textContent);
        pruefe($$(".intro-punkte i").length === 5 && $$(".intro-punkte i")[i].classList.contains("an"), "Punkt " + (i + 1) + " nicht markiert");
        pruefe(!/\{\w+\}/.test($(".intro-seite p").textContent), "Zahl fehlt: " + $(".intro-seite p").textContent);
        if (i > 2) pruefe(/\d/.test($(".intro-seite p").textContent), "keine Anzahl auf Seite " + (i + 1));
        if (i === 0) pruefe($$("[data-introlang]").length === 2 && $("[data-introlang].active"), "Sprachwahl fehlt");
        if (i === 1) pruefe($("#i-name") && $("#i-kg") && $("#i-cm"), "Felder Name, Gewicht, Größe fehlen");
        if (i === 2) pruefe($("svg.intro-schaubild"), "Schaubild fehlt");
        klick("[data-introweiter]");
      }
      pruefe(titel.join(" | ") === "Willkommen bei BLOC | Über dich | So ist BLOC aufgebaut | Workout | Mobility & Stretch", "Seiten: " + titel.join(" | "));
      pruefe(!$("#overlayRoot .intro-sheet"), "„Los geht's“ schließt die Einführung nicht");
      await heim();
      await warte(500);
      pruefe(!$("#overlayRoot .intro-sheet"), "Einführung kommt nach dem Neuladen wieder");
      klick('[data-nav="#settings"]');
      klick(await bis(function () { return $("[data-intro]"); }, 3000, "Einstellungen: Einführung ansehen"));
      await bis(function () { return $("#overlayRoot .intro-sheet"); }, 2000, "Einführung aus den Einstellungen");
      klick("[data-introweg]");
      pruefe(!$("#overlayRoot .intro-sheet"), "„Überspringen“ schließt nicht");
    }],
    ["Startseite: Foto-Kopf, Meine Woche, Workout-Builder; die Bereiche stehen auf „Tools“", async function () {
      await heim();
      pruefe($(".kopf-neu") && $(".woche-neu .woche") && $(".builder-neu"), "Kopf, Wochenkarte und Workout-Builder fehlen");
      pruefe(!$$(".area-tile").length, "Bereichs-Kacheln stehen nicht mehr auf Heute");
      pruefe(/Meine Woche/.test($(".woche .wo-titel").textContent), "Wochenkarte heißt nicht „Meine Woche“: " + $(".woche .wo-titel").textContent);
      pruefe($$("[data-builder]").length === 2, "Workout-Builder: Überrasch mich und Selber bauen erwartet");
      pruefe(!$('[data-nav^="#timers/"]'), "eigene Timer-Zeile steht noch auf der Startseite");
      pruefe(!$("[data-surprise]"), "Überrasch mich steht noch als Karte auf der Startseite");
      pruefe($$("#tabbar .tab").length === 4 && $("#tabbar .tab.active") && /Heute/.test($("#tabbar .tab.active").textContent), "Leiste: vier Ziele, „Heute“ markiert");
      pruefe($(".kopf-neu [data-nav=\"#search\"]") && $(".kopf-neu [data-nav=\"#settings\"]"), "Suche und Einstellungen als Symbole im Kopf");
      // Training: die Bereiche gleichrangig in einer Liste
      klick('#tabbar [data-nav="#training"]');
      await bis(function () { return $(".training-seite .area-tile"); }, 3000, "Seite Training");
      var bereiche = $$(".training-seite .area-tile[data-bereich]").map(function (e) { return e.getAttribute("data-bereich"); }).join(",");
      pruefe(bereiche === "katalog,warm,intervall,run,protein,faq", "Workout, Mobility & Stretch, Timer, Run, Protein und Fragen auf Tools: " + bereiche);
      pruefe($('.area-tile[data-bereich="intervall"][data-nav="#intervall"]') && $('.area-tile[data-bereich="katalog"][data-nav="#katalog"]'), "Timer und Workout fehlen als Bereich auf Training");
      pruefe($("#tabbar .tab.active") && /Tools/.test($("#tabbar .tab.active").textContent), "In der Leiste soll „Tools“ markiert sein");
      // Workout führt direkt in den Baukasten
      zuWorkout();
      await bis(function () { return W.location.hash === "#katalog" && $('[data-kattab="baukasten"].active') && $("[data-bauselber]"); }, 3000, "Workout öffnet den Baukasten");
      pruefe(!$(".bereich-bild"), "Workout: der Bild-Kopf soll entfallen");
      W.go("#home");
      await bis(function () { return $(".kopf-neu"); }, 3000, "zurück zur Startseite");
      pruefe($("#tabbar .tab.active") && /Heute/.test($("#tabbar .tab.active").textContent), "In der Leiste soll „Heute“ markiert sein");
    }],
    ["Workout: Reiter Baukasten · BLOCs, Katalog als Karte im Baukasten, Überrasch mich im Baukasten", async function () {
      zuWorkout();
      await bis(function () { return $$("[data-kattab]").length === 2; }, 3000, "Reiter");
      var tabs = $$("[data-kattab]").map(function (b) { return b.textContent.trim(); }).join(" · ");
      pruefe(tabs === "Baukasten · BLOCs", "Reihenfolge ist " + tabs);
      pruefe($(".rz") && !$(".lib-tabs-card") && !$(".surprise-card"), "Reiterzeile fehlt oder die große Karte steht noch da");
      pruefe(/^Workout$/.test($(".kopf-bereich h1, .topbar h1").textContent.trim()), "Titel ist nicht „Workout“");
      await zuKatalogTab();
      pruefe(!$(".fab") && !$("[data-fab]"), "Das Plus ist weg: es darf kein Plus-Knopf mehr da sein");
      await bis(function () { return $(".af-kopf") && $$(".lib-card").length >= 20; }, 3000, "Workoutkatalog");
      var gr = $$("details.kat-gr");
      pruefe(gr.length >= 6 && gr.every(function (d) { return !d.open && sichtbar(d); }), "Workouts: zu Beginn sollen nur die Überschriften stehen (" + gr.length + " Bereiche)");
      klick(gr[0].querySelector("summary"));
      pruefe(gr[0].open && $$(".lib-card").filter(sichtbar).length >= 1, "Antippen klappt den Bereich nicht auf");
      klick(gr[0].querySelector("summary"));
      pruefe(!gr[0].open, "zweites Antippen klappt nicht zu");
      pruefe($(".af-kopf") && !$(".ort-fotos") && !$("[data-katort]") && !$("[data-surprise]") && !$("[data-bauselber]"), "Im Workoutkatalog sollen nur die Filterkarte (ohne Ort-Schalter), aber nicht Überrasch mich und Selber bauen stehen");
      pruefe($("#tabbar").classList.contains("hidden"), "Im Workout-Bereich gibt es keine untere Leiste");
      // Sortierung A–Z: kleiner Schalter in der Kopfzeile der Filterkarte; sortiert wird innerhalb der Bereiche
      pruefe($(".air-filter .af-az") && !$(".air-filter .fc-seg"), "A–Z-Schalter fehlt oder der Sortier-Block steht noch in der Karte");
      klick(".af-az");
      await bis(function () { return $(".af-az.on"); }, 2000, "A–Z an");
      var az = $$("details.kat-gr").every(function (d) {
        var n = Array.prototype.map.call(d.querySelectorAll(".lib-card .name"), function (e) { return e.textContent.trim(); });
        return n.join("|") === n.slice().sort(function (a, b) { return a.localeCompare(b, "de"); }).join("|");
      });
      pruefe(az, "A–Z: die Workouts sind in den Bereichen nicht alphabetisch");
      klick(".af-az");
      await bis(function () { return !$(".af-az.on"); }, 2000, "A–Z aus");
      // Baukasten: Überrasch mich oder Selber bauen, groß und vorn
      klick('[data-kattab="baukasten"]');
      await bis(function () { return $(".bau-karte[data-surprise]") && $(".bau-karte[data-bauselber]"); }, 3000, "Baukasten mit zwei Wegen");
      var sl = $(".bau-karte[data-surprise]");
      pruefe(sl.getBoundingClientRect().height >= 70 && !$(".topbar .bau-karte"), "Die zwei Wege im Baukasten sollen groß sein");
      pruefe($("#tabbar").classList.contains("hidden"), "Im Baukasten gibt es keine untere Leiste");
      // Baukasten ohne Ort: nur „1 Wie willst du trainieren?“ (Nach Zeit / Nach Sätzen, Standard Nach Zeit) und „2 Wie willst du dein Workout bauen?“
      pruefe(!$(".ort-foto") && !$(".ort-fotos") && !$("[data-bauort]") && !$("[data-katort]"), "Baukasten: Ort-Fotokarten gibt es nicht mehr");
      pruefe($$(".bau-schritt").length === 1 && !/[0-9]/.test($(".bau-schritt").textContent), "Baukasten: nur eine Überschrift ohne Zahl erwartet, gefunden " + $$(".bau-schritt").length);
      pruefe(!$("[data-bauart]") && /Wie willst du/.test($(".bau-schritt").textContent), "Baukasten: keine Knöpfe Nach Zeit / Nach Sätzen mehr, nur die Überschrift „Wie willst du dein Workout bauen?“");
      // Übungskatalog: eigene Seite, alle Übungen zugeklappt nach Bereichen, „Eigene Übung anlegen“ oben
      await zuUebungskatalog();
      pruefe($("[data-stnew2]") && /Eigene Übung/.test($("[data-stnew2]").textContent), "„Eigene Übung anlegen“ fehlt im Übungskatalog");
      // kein Ort-Schalter mehr: im Filter stehen 1 Trainingsart (drei Fotokarten mit Übungszahl), 2 Ausrüstung, 3 Muskel
      pruefe(!$("[data-katort]") && !$(".ort-fotos"), "Übungskatalog: der Ort-Schalter ist weg (zu, solange der Filter zu ist)");
      if (!$(".af-body")) klick(".af-kopf");
      await bis(function () { return $(".af-body"); }, 2000, "Filterkarte im Übungskatalog");
      pruefe(!$("[data-katort]") && $$(".ort-foto").length === 3 && $$(".ort-foto[data-sttrain]").length === 3 && /Übungen/.test($(".ort-fotos").textContent) && $$(".ort-foto img[src^='img/']").length === 3, "Übungskatalog: drei Fotokarten der Trainingsart mit Übungszahl fehlen");
      pruefe($$(".bau-schritt.af-schritt").length === 3, "Filter: drei Schritte (Trainingsart, Ausrüstung, Muskel) erwartet, gefunden " + $$(".bau-schritt.af-schritt").length);
      pruefe(!$('[data-start]') && !$('[data-stger]'), "Die alten Ausrüstungs-Chips (data-start, data-stger) gibt es nicht mehr");
      var ug = $$("details.kat-gr");
      pruefe(ug.length >= 7 && ug.every(function (d) { return !d.open && sichtbar(d); }), "Übungen: zu Beginn sollen nur die Überschriften stehen (" + ug.length + " Bereiche)");
    }],
    ["Suche: „pull ups“, „klimmzug“, „liegestutz“", async function () {
      await zuUebungskatalog();
      var q = await bis(function () { return $("#st-q"); }, 3000, "Suchfeld");
      function namen(x) { eingeben(q, x); return $$(".fig-karte").filter(sichtbar).map(function (c) { return (c.querySelector(".fig-name") || {}).textContent || ""; }); }
      pruefe(namen("pull ups").indexOf("Pull-ups") > -1, "„pull ups“ findet Pull-ups nicht");
      pruefe(namen("klimmzug").length >= 5, "„klimmzug“ findet zu wenig");
      pruefe(namen("liegestutz").indexOf("Push-ups") > -1, "„liegestutz“ findet Push-ups nicht");
      eingeben(q, "");
      pruefe($$("[data-studio]:not([data-ortfremd])").filter(function (c) { return c.style.display !== "none"; }).length > 100, "ohne Suche zu wenige Übungen");
      pruefe($$("details.kat-gr").every(function (d) { return !d.open; }), "nach der Suche stehen die Bereiche nicht wieder zugeklappt da");
    }],
    ["Übungsinfo: Pull-ups mit zwei Ansichten", async function () {
      klick('[data-studio="pull-ups"]:not([data-ortfremd])');
      klick(await bis(function () { return $("[data-stinfo]"); }, 3000, "Info-Knopf auf der Karte"));
      await bis(function () { return $$(".info-views figure").length === 2; }, 3000, "zwei Ansichten");
      klick("[data-close]");
      klick("button.back");
      await bis(function () { return $("#st-q"); }, 3000, "zurück im Katalog");
    }],
    ["Körperkarte: Gruppe antippen filtert die Übungen, Info mit Silhouetten, Auswertung mit Summe", async function () {
      await heim();
      zuWorkout();
      await zuUebungskatalog();
      await bis(function () { return $$("[data-studio]:not([data-ortfremd])").length > 100; }, 3000, "Übungen im Katalog");
      var alle = $$("[data-studio]:not([data-ortfremd])").length;
      await filterAuf();
      pruefe($$(".kk-filter .kk").length === 2 && $$("[data-stzone]").length >= 12, "Körperkarte im Filter fehlt");
      klick('.fc-chip[data-stzone="brust"]');
      await bis(function () { return $('.fc-chip[data-stzone="brust"].on') && $(".af-body"); }, 2000, "Brust gewählt, Karte bleibt offen");
      var brust = $$("[data-studio]:not([data-ortfremd])").length;
      pruefe(brust > 0 && brust < alle, "Filter Brust: " + brust + " von " + alle);
      pruefe(!$('[data-studio="air-squats"]:not([data-ortfremd])') && $('[data-studio="push-ups"]:not([data-ortfremd])') && $('[data-studio="chest-press-machine"]:not([data-ortfremd])'), "Brust-Filter zeigt falsche Übungen (ohne Wahl der Trainingsart: Brust-Übungen aller Arten)");
      // dazu die Trainingsart Körpergewicht: Brust ohne Geräte
      await trainNur(["body"]);
      await bis(function () { var n = $$("[data-studio]:not([data-ortfremd])").length; return $('.fc-chip[data-stzone="brust"].on') && $('[data-sttrain="body"].on') && n > 0 && n < brust; }, 2000, "Brust + Körpergewicht zeigt weniger Übungen");
      pruefe($('[data-studio="push-ups"]:not([data-ortfremd])') && !$('[data-studio="chest-press-machine"]:not([data-ortfremd])') && !$('[data-studio="air-squats"]:not([data-ortfremd])'), "Brust + Körpergewicht zeigt Geräte");
      pruefe(W.state.db.settings.stTrain.join() === "body", "Trainingsart nicht in settings.stTrain gespeichert: " + JSON.stringify(W.state.db.settings.stTrain));
      klick('[data-streset]');
      await bis(function () { return $$("[data-studio]:not([data-ortfremd])").length === alle && !$("[data-sttrain].on") && !$("[data-stzone].on"); }, 2000, "zurückgesetzt (auch die Trainingsart)");
      // Detailansicht: an = 21 Zonen, größer; die Auswahl wandert mit; danach wieder aus (10 Zonen)

      klick(await bis(function () { return $("[data-go]"); }, 3000, "Mit Timer starten"));
      await bis(function () { return $("#playerRoot .player") && $(".pl-prog"); }, 3000, "Timer mit Trainingsplan-Zeile");
      pruefe(/Plan DK · 1\/2/.test($(".pl-prog").textContent), "Zeile: " + $(".pl-prog").textContent);
      W.exitPlayer();
      pruefe(W.location.hash === "#koerper", "Beenden führt in die Arena: " + W.location.hash);
    }],
    ["Trainingsplan mit Stern erscheint unter Favoriten auf Heute", async function () {
      await heim();
      W.programmListe().push({ id: "pg-fv", name: "Plan Fav", items: ["zufall"], tage: [0], wochen: 4, pos: 0, fav: true, updatedAt: Date.now() }); W.save();
      W.programmListe();   // alter Stern wandert in die Favoriten
      pruefe(W.isFav("prog:pg-fv"), "Stern (alt) nicht in den Favoriten");
      await heim();
      pruefe(W.favEntries().some(function (e) { return e.name === "Plan Fav"; }), "Trainingsplan fehlt in den Favoriten");
      pruefe(/Plan Fav/.test($("#app").textContent) || /Plan Fav/.test(D.body.textContent), "Trainingsplan steht nicht auf Heute");
    }],
    ["Path › Deep Dive: Reiter, Kennzahlen, Verteilung, Körperfigur pro Woche und pro Workout, Vorschlag", async function () {
      await heim();
      var ids = Object.keys(W.EX_MUSCLES).slice(0, 8), jetzt = Date.now();
      W.state.db.history = [{ at:jetzt - 3600000, ex:ids.slice(0, 5), dur:1500, b:"lib" }, { at:jetzt - 7200000, ex:ids.slice(3, 8), dur:1200, b:"lib" }];
      W.state.db.settings.koerperTab = "deepdive"; W.save();
      W.go("#koerper");
      await bis(function () { return $(".dd-nav") && $$(".dd-karte").length >= 6; }, 3000, "Deep Dive mit Häufigkeit, Kalender, Balance, Anteil und zwei Workouts");
      pruefe($$(".dd-chips span").length === 3, "drei Kennzahlen (Trainings, Zeit, Übungen)");
      pruefe(W.MUSKEL_GRP.length === 8 && $$(".dd-verteilung .ausw-row").length === W.MUSKEL_GRP.length, "Verteilung auf acht Muskelgruppen (Brust, Rücken, Schulter, Arme, Bauch, Core, Beine, Po): " + $$(".dd-verteilung .ausw-row").length);
      pruefe($$(".dd-karte .kk-kopf").length >= 3, "Körperfigur pro Woche und pro Workout");
      pruefe($(".dd-vorschlag [data-ddgo]") && $(".dd-vorschlag [data-ddkal]") && $(".dd-vorschlag .fav-btn"), "Idee für die nächste Einheit: Ansehen, In Kalender einfügen und Stern");
      // Stern: merken und wieder entfernen
      var favKey = $(".dd-vorschlag .fav-btn").getAttribute("data-fav"), favVor = W.isFav(favKey);
      klick($(".dd-vorschlag .fav-btn"));
      await bis(function () { return W.isFav(favKey) !== favVor && $(".dd-vorschlag .fav-btn"); }, 2000, "Stern gesetzt");
      if(W.isFav(favKey) !== favVor) W.toggleFav(favKey);
      // In Kalender einfügen: Tagesauswahl mit sieben Tagen, der erste (heute) legt den Termin an
      var ideeId = $(".dd-vorschlag [data-ddkal]").getAttribute("data-ddkal"), kalVor = W.kalListe().length;
      klick($(".dd-vorschlag [data-ddkal]"));
      await bis(function () { return $$("#overlayRoot .act-sheet [data-act]").length === 7; }, 2000, "Tagesauswahl mit sieben Tagen");
      klick($("#overlayRoot .act-sheet [data-act=\"0\"]"));
      var neuE = W.kalListe().filter(function (e) { return e.art === "lib" && e.ref === ideeId; }).pop();
      pruefe(W.kalListe().length === kalVor + 1 && neuE, "Termin im Kalender angelegt");
      W.state.db.settings.kalender.e = [];   // alle Testtermine weg, damit der Umschalter nur ohne Termine geprüft wird
      W.renderKoerper();
      pruefe($(".dd-freq .kk-paar") && $$(".dd-freq .kk-zeile").length >= 1, "Häufigkeit pro Muskelgruppe: Figur und Zeilen");
      pruefe($$(".dd-kal-zeile:not(.dd-kal-kopf)").length === W.MUSKEL_GRP.length && $$(".dd-kal-zeile:not(.dd-kal-kopf) .dd-punkt").length === 7 * W.MUSKEL_GRP.length, "Muskel-Kalender: acht Gruppen mal sieben Tage, gefunden " + $$(".dd-kal-zeile:not(.dd-kal-kopf)").length + " Zeilen");
      pruefe($$(".dd-kal .dd-punkt.an").length >= 2 && $(".dd-haeufig"), "Muskel-Kalender: volle Punkte und Zahl der Tage");
      pruefe($$(".dd-bal").length === 2 && $(".dd-who-m"), "Balance (Drücken/Ziehen, Ober-/Unterkörper) und Krafttage");
      pruefe(!$(".dd-modus"), "ohne Termine im Kalender kein Umschalter Trainiert/Mit Plan");
      // Termin im Kalender: Umschalter erscheint, Mit Plan zeigt hohle Punkte für den geplanten Tag
      var mo = W.kalMontag(new Date()), planTag = W.kalPlus(mo, (new Date().getDay() + 6) % 7 === 0 ? 1 : 0);
      var termin = W.kalHinzu(W.kalTagKey(planTag), { art:"lib", ref:"gym-chest-db" });
      W.renderKoerper();
      await bis(function () { return $$(".dd-modus button").length === 2; }, 2000, "Umschalter Trainiert/Mit Plan");
      klick($("[data-ddmodus=\"plan\"]"));
      await bis(function () { return $(".dd-punkt.plan"); }, 2000, "Mit Plan: hohler Punkt für den geplanten Tag");
      W.state.db.settings.kalender.e = W.kalListe().filter(function (e) { return e.id !== termin.id; }); W.ddModus = null;
      // Übungsinfo: Zeile „Letzte 30 Tage“
      pruefe(/info-historie/.test(W.kkInfoHTML(W.findExercise(ids[0]))), "Übungsinfo zeigt die Zeile „Letzte 30 Tage“");
      klick($("[data-ddwoche=\"-1\"]"));
      await bis(function () { return $(".dd-leer"); }, 2000, "vorherige Woche ohne Training: Hinweis statt Figur");
      pruefe($("[data-ddwoche=\"1\"]") && !$("[data-ddwoche=\"1\"]").disabled, "Weiter-Pfeil ist in der Vorwoche aktiv");
      W.ddWoche = 0; W.state.db.history = []; W.state.db.settings.koerperTab = "programm"; W.save();
    }],
    ["Katalog: neue Workouts für dünn besetzte Gruppen (je Gruppe und Ort höchstens 25 % gleiche Übungen), Körperfigur auf der Karte", async function () {
      var neu = ["bw-chest-band", "gym-chest-db", "gym-chest-cable", "gym-shoulders-db", "gym-shoulders-cable", "bw-shoulders", "band-shoulders",
        "gym-back-cable", "gym-back-free-weights", "gym-biceps", "gym-triceps", "gym-core-cable", "gym-core-crunch"];
      var alle = W.LIB_WORKOUTS.filter(function (lw) { return !W.libIstWarmDehn(lw); }).map(function (lw) {
        var exs = lw.exercises.map(W.findExercise);
        return { id:lw.id, ids:lw.exercises, ok:exs.every(Boolean), b:W.katWoBereich(lw, exs.filter(Boolean)), o:W.katWoOrt(exs.filter(Boolean)) };
      });
      neu.forEach(function (id) {
        var w = alle.filter(function (x) { return x.id === id; })[0];
        pruefe(w, "Workout fehlt: " + id);
        pruefe(w.ok, "unbekannte Übung in " + id);
        var info = W.BLOC_DATEN.LIB_WORKOUT_INFO[id];
        pruefe(info && info[0] && info[1], "Hinweis (Deutsch/Englisch) fehlt: " + id);
        alle.filter(function (x) { return x.id !== id && x.b === w.b && x.o === w.o; }).forEach(function (x) {
          var gleich = w.ids.filter(function (e) { return x.ids.indexOf(e) > -1; }).length;
          pruefe(gleich/w.ids.length <= 0.25, id + " deckt sich zu " + Math.round(gleich/w.ids.length*100) + " % mit " + x.id);
        });
      });
      // jede Gruppe und jeder Ort hat mindestens zwei Workouts; Cardio im Fitnessstudio nur noch eines (die Battle-Rope-Workouts sind entfernt: übrig bleibt metcon-db)
      ["brust/frei", "brust/studio", "schulter/studio", "schulter/frei", "ruecken/studio", "arme/studio", "bauch/studio"].forEach(function (k) {
        pruefe(alle.filter(function (x) { return x.b + "/" + x.o === k; }).length >= 2, "weniger als zwei Workouts in " + k);
      });
      pruefe(alle.filter(function (x) { return x.b + "/" + x.o === "cardio/studio"; }).length >= 1, "kein Cardio-Workout mit Fitnessstudio-Geräten");
      W.state.db.settings.katTab = "katalog"; W.state.db.settings.katAbt = "workouts"; W.state.db.settings.stTrain = ["studio"]; W.state.db.settings.stFilterOpen = true; W.save();
      W.go("#katalog"); W.renderKatalog();
      await bis(function () { return $$(".lib-card").length > 0; }, 3000, "Workout-Karten im Katalog");
      pruefe($$(".lib-card .kk-mini").length > 0, "kleine Körperfigur auf den Workout-Karten");
      pruefe($(".lib-card .pg-figs"), "Platz für die Übungsfiguren auf den Workout-Karten");
      klick(await bis(function () { return $("details.kat-gr:not([open]) > summary"); }, 2000, "zugeklappte Gruppe"));
      await bis(function () { return $("details.kat-gr[open] .lib-card .pg-figs svg"); }, 3000, "Übungsfiguren erscheinen beim Aufklappen");
      pruefe($(".ort-foto.on[data-sttrain=\"studio\"]") && getComputedStyle($(".ort-foto.on[data-sttrain=\"studio\"]")).borderTopColor !== getComputedStyle($(".ort-foto[data-sttrain=\"cali\"]")).borderTopColor, "Karte Fitnessstudio (gewählt) hat eine andere Farbe als die nicht gewählten Karten");
    }],
    ["Keine Skriptfehler", async function () {
      pruefe(!fehler.length, fehler.slice(0, 3).join(" | "));
    }]
  ];

  function eintrag(name) { var li = document.createElement("li"); li.textContent = name + " …"; liste.appendChild(li); return li; }

  document.getElementById("los").addEventListener("click", async function () {
    var knopf = this;
    if (!lokal) { summe.className = "fail"; summe.textContent = "Nur lokal ausführen (localhost) – sonst würde der Test deinen echten Stand anfassen."; return; }
    knopf.disabled = true; liste.innerHTML = ""; summe.textContent = ""; fehler = [];
    var gesichert = localStorage.getItem(KEY), ss = {};
    for (var i = 0; i < sessionStorage.length; i++) { var k = sessionStorage.key(i); ss[k] = sessionStorage.getItem(k); }
    localStorage.removeItem(KEY);   // frischer Stand, damit der Test immer gleich läuft
    var ok = 0, schlecht = 0;
    try {
      var nur = /[?&]nur=([^&]*)/.exec(location.search);   // ?nur=Umbau: nur Tests, deren Titel das Wort enthält
      for (var t = 0; t < TESTS.length; t++) {
        if (nur && TESTS[t][0].indexOf(decodeURIComponent(nur[1])) < 0) continue;
        var li = eintrag(TESTS[t][0]);
        try { await TESTS[t][1](); li.className = "ok"; li.textContent = "✓ " + TESTS[t][0]; ok++; }
        catch (e) {
          li.className = "fail"; li.textContent = "✗ " + TESTS[t][0];
          var sm = document.createElement("small"); sm.textContent = e && e.message ? e.message : String(e); li.appendChild(sm);
          schlecht++;
        }
      }
    } finally {
      iframe.src = "about:blank";
      await warte(200);
      if (gesichert === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, gesichert);
      sessionStorage.clear(); Object.keys(ss).forEach(function (k) { sessionStorage.setItem(k, ss[k]); });
      summe.className = schlecht ? "fail" : "ok";
      summe.textContent = schlecht ? schlecht + " von " + TESTS.length + " Prüfungen fehlgeschlagen" : "Alles in Ordnung: " + ok + " von " + TESTS.length + " Prüfungen bestanden";
      document.title = (schlecht ? "✗ " : "✓ ") + "BLOC Schnelltest";
      knopf.disabled = false;
    }
  });
  if (/[?&]auto\b/.test(location.search)) document.getElementById("los").click();
})();
</script>
